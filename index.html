<style>
/* MusicUnlock 官网样式：沿用 audio-site 的 Fluent 变量与排版节奏。作者：NiceDevin。 */
:root{
  --font:"Segoe UI Variable Display","Segoe UI Variable Text","Segoe UI",
         "Microsoft YaHei UI","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  --accent:#0F6CBD;
  --accent-2:#3B8CE8;
  --radius-card:10px;
  --radius-ctl:6px;
  --shell-max:1180px;
}
@media (prefers-color-scheme:light){
  :root{
    --bg:#EFEFF1;--bg-2:#F7F7F8;--card:rgba(255,255,255,.78);--card-solid:#FFF;
    --stroke:rgba(0,0,0,.09);--stroke-strong:rgba(0,0,0,.16);
    --text:#18181A;--text-2:#45454A;--muted:#6B6B72;--hover:rgba(0,0,0,.045);
    --accent-text:#0B5CA8;--glow:rgba(15,108,189,.14);
    --shadow:0 1px 2px rgba(0,0,0,.07),0 8px 24px rgba(0,0,0,.06);
  }
}
@media (prefers-color-scheme:dark){
  :root{
    --accent:#2F86D8;--accent-2:#63ADF5;
    --bg:#17171A;--bg-2:#1D1D20;--card:rgba(255,255,255,.045);--card-solid:#232327;
    --stroke:rgba(255,255,255,.075);--stroke-strong:rgba(255,255,255,.16);
    --text:#F1F1F3;--text-2:#C3C3C8;--muted:#93939B;--hover:rgba(255,255,255,.06);
    --accent-text:#8CBEFF;--glow:rgba(47,134,216,.2);
    --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 32px rgba(0,0,0,.3);
  }
}
html[data-theme="light"]{
  --bg:#EFEFF1;--bg-2:#F7F7F8;--card:rgba(255,255,255,.78);--card-solid:#FFF;
  --stroke:rgba(0,0,0,.09);--stroke-strong:rgba(0,0,0,.16);
  --text:#18181A;--text-2:#45454A;--muted:#6B6B72;--hover:rgba(0,0,0,.045);
  --accent:#0F6CBD;--accent-2:#3B8CE8;--accent-text:#0B5CA8;--glow:rgba(15,108,189,.14);
  --shadow:0 1px 2px rgba(0,0,0,.07),0 8px 24px rgba(0,0,0,.06);
}
html[data-theme="dark"]{
  --bg:#17171A;--bg-2:#1D1D20;--card:rgba(255,255,255,.045);--card-solid:#232327;
  --stroke:rgba(255,255,255,.075);--stroke-strong:rgba(255,255,255,.16);
  --text:#F1F1F3;--text-2:#C3C3C8;--muted:#93939B;--hover:rgba(255,255,255,.06);
  --accent:#2F86D8;--accent-2:#63ADF5;--accent-text:#8CBEFF;--glow:rgba(47,134,216,.2);
  --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 32px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *{animation-duration:.001ms!important;transition-duration:.001ms!important}
}
body{
  margin:0;font-family:var(--font);background:var(--bg);color:var(--text);
  font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;overflow-x:hidden;
}
.mica{
  position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(900px 520px at 78% -8%,var(--glow),transparent 68%),
    radial-gradient(760px 460px at 8% 12%,rgba(120,120,140,.10),transparent 70%),
    linear-gradient(180deg,var(--bg-2),var(--bg) 46%,var(--bg));
}
.appbar{
  position:sticky;top:0;z-index:50;
  backdrop-filter:blur(30px) saturate(150%);
  -webkit-backdrop-filter:blur(30px) saturate(150%);
  background:color-mix(in srgb,var(--bg) 72%,transparent);
  border-bottom:1px solid var(--stroke);
}
@supports not (background:color-mix(in srgb,red 50%,transparent)){.appbar{background:var(--bg)}}
.appbar-inner{
  max-width:var(--shell-max);margin:0 auto;padding:0 24px;height:56px;
  display:flex;align-items:center;gap:16px;
}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);flex-shrink:0}
.brand img{width:24px;height:24px;display:block;border-radius:6px}
.brand-name{font-size:15px;font-weight:600;letter-spacing:-.01em}
.appbar nav{display:flex;gap:2px;margin-left:auto}
.appbar nav a{
  color:var(--text-2);text-decoration:none;font-size:13px;padding:6px 12px;
  border-radius:var(--radius-ctl);white-space:nowrap;
}
.appbar nav a:hover{background:var(--hover);color:var(--text)}
.lang-seg,.theme-seg{
  display:flex;padding:2px;gap:2px;border:1px solid var(--stroke);
  border-radius:8px;background:var(--card);flex-shrink:0;
}
.lang-seg button,.lang-seg a,.theme-seg button{
  appearance:none;border:0;background:transparent;color:var(--muted);
  border-radius:5px;cursor:pointer;display:grid;place-items:center;padding:0;
  text-decoration:none;
}
.lang-seg button,.lang-seg a{font-family:var(--font);font-size:11px;font-weight:600;height:26px;padding:0 8px;letter-spacing:.02em}
.theme-seg button{width:30px;height:26px}
.lang-seg button[aria-pressed="true"],.lang-seg a[aria-pressed="true"],.theme-seg button[aria-pressed="true"]{background:var(--hover);color:var(--text)}
.lang-seg button:hover,.lang-seg a:hover,.theme-seg button:hover{color:var(--text)}
.theme-seg svg{width:14px;height:14px}
.lang-seg button:focus-visible,.lang-seg a:focus-visible,.theme-seg button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.shell{max-width:var(--shell-max);margin:0 auto;padding:0 24px}
section{padding:84px 0}
section+section{border-top:1px solid var(--stroke)}
.eyebrow{
  font-size:12px;letter-spacing:.08em;color:var(--muted);margin:0 0 14px;
  display:flex;align-items:center;gap:8px;text-transform:uppercase;
}
.eyebrow::before{content:"";width:14px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
h2{font-size:30px;line-height:1.25;letter-spacing:-.022em;font-weight:600;margin:0 0 12px}
.lede{color:var(--text-2);max-width:min(36em,100%);margin:0;text-wrap:pretty}

/* Hero */
.hero{padding:76px 0 64px}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:56px;align-items:center}
.hero h1{
  font-size:42px;line-height:1.12;letter-spacing:-.028em;font-weight:650;
  margin:0 0 8px;text-wrap:balance;
}
.hero .grad{
  background:linear-gradient(120deg,var(--accent),var(--accent-2));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.hero-sub{color:var(--text-2);max-width:min(36em,100%);margin:14px 0 22px;font-size:16px;text-wrap:pretty}
.hero-points{display:flex;flex-direction:column;gap:9px;margin:0 0 26px;padding:0;list-style:none}
.hero-points li{display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--text-2)}
.hero-points li .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex-shrink:0}
.cta-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  height:38px;padding:0 18px;border-radius:var(--radius-ctl);
  font-family:var(--font);font-size:13.5px;font-weight:600;text-decoration:none;
  border:1px solid transparent;cursor:pointer;transition:background .15s,border-color .15s,transform .15s;
}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn-ghost{background:var(--card);color:var(--text);border-color:var(--stroke-strong)}
.btn-ghost:hover{background:var(--hover)}
.btn:active{transform:translateY(1px)}
.meta-note{font-size:12px;color:var(--muted);margin:12px 0 0}

/* Mock window */
.window{
  border:1px solid var(--stroke);border-radius:12px;overflow:hidden;
  background:var(--card-solid);box-shadow:var(--shadow);
}
.titlebar{
  height:38px;display:flex;align-items:center;gap:9px;padding:0 12px;
  border-bottom:1px solid var(--stroke);background:var(--bg-2);
}
.titlebar img{width:18px;height:18px;border-radius:5px}
.titlebar span{font-size:12px;font-weight:600}
.wdots{margin-left:auto;display:flex;gap:6px}
.wdots i{width:9px;height:9px;border-radius:50%;background:var(--stroke-strong);display:block}
.mock-body{padding:14px}
.drop{
  border:1px dashed var(--stroke-strong);border-radius:9px;padding:16px 12px;
  text-align:center;color:var(--muted);font-size:12px;
  background:linear-gradient(180deg,var(--card),transparent);
}
.drop b{display:block;color:var(--text);font-size:13px;margin-bottom:2px}
.rows{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.row{
  display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:9px;
  padding:8px 9px;border:1px solid var(--stroke);border-radius:7px;background:var(--card);
}
.row .ic{
  width:20px;height:20px;border-radius:5px;display:grid;place-items:center;
  background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent-text);
  font-size:10px;font-weight:700;
}
.row .nm{font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .fname{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11.5px}
.mini-bar{height:3px;border-radius:2px;background:var(--stroke);overflow:hidden;margin-top:5px}
.mini-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent-2),var(--accent));transition:width .3s linear}
.row.done .st{color:var(--text-2)}
.row .st{font-size:10.5px;color:var(--muted)}
.bar{grid-column:2 / 4;height:2px;background:var(--stroke);border-radius:2px;overflow:hidden;margin-top:-3px}
.bar i{display:block;height:100%;width:64%;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
.window-foot{
  display:flex;align-items:center;gap:8px;margin-top:12px;padding-top:11px;
  border-top:1px solid var(--stroke);font-size:11px;color:var(--muted);
}
.window-foot .out-note{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn-run{
  appearance:none;cursor:pointer;border:0;border-radius:5px;
  font-family:var(--font);font-size:11.5px;font-weight:600;color:#fff;
  padding:5px 12px;background:linear-gradient(180deg,var(--accent-2),var(--accent));
  box-shadow:0 1px 2px rgba(0,0,0,.18);flex-shrink:0;
}
.btn-run:hover{filter:brightness(1.06)}
.btn-run:disabled{opacity:.6;cursor:default}
.demo-note{
  margin:9px 0 0;font-size:11px;color:var(--muted);
  display:flex;align-items:flex-start;gap:6px;line-height:1.5;
}
.demo-note svg{width:12px;height:12px;margin-top:2px;color:var(--text-2);flex-shrink:0}
.store-badge{
  display:inline-flex;align-items:center;gap:10px;text-decoration:none;
  border:1px solid var(--stroke-strong);border-radius:8px;background:var(--card);
  color:var(--text);padding:8px 14px;min-width:190px;
}
.store-badge:hover{background:var(--hover)}
.store-badge[aria-disabled="true"]{cursor:default;opacity:.78}
.store-badge .glyph{
  width:26px;height:26px;border-radius:5px;display:grid;place-items:center;
  background:var(--accent);color:#fff;font-size:13px;font-weight:700;flex-shrink:0;
}
.store-badge .txt{display:flex;flex-direction:column;line-height:1.25}
.store-badge .txt b{font-size:11px;font-weight:600;color:var(--text-2)}
.store-badge .txt span{font-size:13px;font-weight:600}

/* Cards */
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:30px}
.card{
  border:1px solid var(--stroke);border-radius:var(--radius-card);
  background:var(--card);padding:20px;box-shadow:var(--shadow);
}
.card .ico{
  width:32px;height:32px;border-radius:8px;display:grid;place-items:center;
  background:color-mix(in srgb,var(--accent) 13%,transparent);color:var(--accent-text);
  font-size:15px;margin-bottom:12px;
}
.card h3{font-size:15px;margin:0 0 6px;letter-spacing:-.01em}
.card p{font-size:13px;color:var(--text-2);margin:0}

/* Formats */
.formats-wrap{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:40px;margin-top:32px;align-items:start}
.format-group + .format-group{margin-top:20px}
.format-group h3{font-size:13px;color:var(--muted);font-weight:600;margin:0 0 8px;letter-spacing:.03em;text-transform:uppercase}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{
  font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;
  font-size:12px;padding:3px 7px;border-radius:5px;
  border:1px solid var(--stroke);background:var(--card);color:var(--text-2);
}
.tag.hot{border-color:color-mix(in srgb,var(--accent) 45%,var(--stroke));color:var(--accent-text)}
.copy-row{display:flex;gap:8px;margin-top:16px;align-items:center;flex-wrap:wrap}
.copy-row code{font-size:11px;color:var(--muted)}

/* Inspector */
.inspector{
  border:1px solid var(--stroke);border-radius:var(--radius-card);
  background:var(--card-solid);padding:18px;box-shadow:var(--shadow);
}
.inspector-drop{
  border:1px dashed var(--stroke-strong);border-radius:8px;padding:22px 16px;
  text-align:center;cursor:pointer;transition:border-color .15s,background .15s;
}
.inspector-drop:hover,.inspector-drop.over{border-color:var(--accent);background:var(--hover)}
.inspector-drop b{display:block;font-size:14px;margin-bottom:3px}
.inspector-drop span{font-size:12px;color:var(--muted)}
.inspector-drop input{display:none}
.inspector-summary{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;font-size:12px;color:var(--muted)}
.inspector-summary .ok{color:var(--accent-text);font-weight:600}
.inspector-list{display:flex;flex-direction:column;gap:6px;margin-top:12px;max-height:260px;overflow:auto}
.inspector-item{
  display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;
  padding:7px 9px;border:1px solid var(--stroke);border-radius:6px;background:var(--card);
  font-size:12px;
}
.inspector-item .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inspector-item .st{font-size:11px;color:var(--muted)}
.inspector-item .st.bad{color:#C42B1C}
html[data-theme="dark"] .inspector-item .st.bad{color:#FF99A4}
.inspector-empty{font-size:12px;color:var(--muted);margin-top:12px}

/* Steps */
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:30px}
.step{padding:18px 18px 20px;border:1px solid var(--stroke);border-radius:var(--radius-card);background:var(--card)}
.step .no{
  font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--accent-text);
  display:inline-flex;align-items:center;gap:7px;margin-bottom:10px;
}
.step .no i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 14%,transparent);font-style:normal;font-size:10px}
.step h3{font-size:14.5px;margin:0 0 5px}
.step p{font-size:12.5px;color:var(--text-2);margin:0}

/* Privacy band */
.privacy-band{
  border:1px solid var(--stroke);border-radius:var(--radius-card);
  background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 9%,transparent),var(--card));
  padding:26px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center;
}
.privacy-band h2{font-size:24px;margin-bottom:8px}
.privacy-band p{margin:0;font-size:13.5px;color:var(--text-2);max-width:42em}

/* FAQ */
.faq{display:flex;flex-direction:column;gap:8px;margin-top:26px}
details{
  border:1px solid var(--stroke);border-radius:8px;background:var(--card);
  padding:0 16px;
}
details[open]{background:var(--card-solid)}
summary{
  cursor:pointer;list-style:none;padding:14px 0;font-size:14px;font-weight:600;
  display:flex;align-items:center;gap:10px;
}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";margin-left:auto;color:var(--muted);font-weight:400}
details[open] summary::after{content:"−"}
details p{margin:0 0 14px;font-size:13px;color:var(--text-2);max-width:60em}

/* Download */
.download{
  border:1px solid var(--stroke);border-radius:12px;background:var(--card-solid);
  box-shadow:var(--shadow);padding:32px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px;align-items:center;
}
.download h2{font-size:26px;margin-bottom:6px}
.download p{margin:0;color:var(--text-2);font-size:13.5px;max-width:40em}
.download .actions{display:flex;flex-direction:column;gap:8px;align-items:stretch}
.note{font-size:11.5px;color:var(--muted);margin-top:8px}

footer{border-top:1px solid var(--stroke);padding:30px 0 46px}
.foot{display:flex;flex-wrap:wrap;gap:12px;align-items:center;font-size:12px;color:var(--muted)}
.foot a{color:var(--text-2);text-decoration:none}
.foot a:hover{color:var(--text);text-decoration:underline}
.foot .sep{margin-left:auto}

@media (max-width:940px){
  .hero-grid,.formats-wrap,.download{grid-template-columns:minmax(0,1fr);gap:32px}
  .grid-3,.steps{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hero h1{font-size:34px}
  .privacy-band{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:640px){
  .appbar nav a{padding:6px 8px;font-size:12px}
  .appbar nav a:nth-child(n+4){display:none}
  section{padding:60px 0}
  .grid-3,.steps{grid-template-columns:minmax(0,1fr)}
  .hero h1{font-size:30px}
  h2{font-size:24px}
}
